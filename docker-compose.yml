services:
  frontend:
    build: .
    container_name: cv-frontend
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cv-web.rule=Host(`lorycarvajol.dev`) || Host(`www.lorycarvajol.dev`)"
      - "traefik.http.routers.cv-web.entrypoints=websecure"
      - "traefik.http.routers.cv-web.tls.certresolver=myresolver"
      - "traefik.http.services.cv-web.loadbalancer.server.port=80"
      # Redirection permanente www -> domaine racine (evite le contenu duplique).
      # Le $$ est obligatoire : Compose interpole $, un ${1} simple serait avale
      # avant d'atteindre Traefik.
      - "traefik.http.middlewares.cv-www.redirectregex.regex=^https://www\\.lorycarvajol\\.dev/(.*)"
      - "traefik.http.middlewares.cv-www.redirectregex.replacement=https://lorycarvajol.dev/$${1}"
      - "traefik.http.middlewares.cv-www.redirectregex.permanent=true"
      - "traefik.http.routers.cv-web.middlewares=cv-www"

  # Detient les cles API (Resend, Anthropic) : formulaire de contact et chatbot.
  # Un service distinct plutot qu'un appel depuis le React : ces cles autorisent
  # des envois au nom du domaine et des appels factures, elles ne doivent jamais
  # partir dans le navigateur.
  mailer:
    build: ./mailer
    container_name: cv-mailer
    restart: unless-stopped
    # Renseigne dans .env, non versionne (voir .env.example).
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM:-contact@lorycarvajol.dev}
      - MAIL_TO=${MAIL_TO:-lorycarvajolwebdev@gmail.com}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHAT_BUDGET_JETONS_JOUR=${CHAT_BUDGET_JETONS_JOUR:-200000}
    # Monte plutot que copie : les faits du CV ont une seule source, partagee
    # avec les pages React qui importent le meme fichier. Le copier dans l'image
    # recreerait la duplication que ce fichier existe pour supprimer.
    volumes:
      - ./src/data/parcours.json:/app/parcours.json:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Meme hote que le site, mais sur /api. La regle etant plus specifique
      # que celle du frontend, Traefik la fait gagner ; la priorite explicite
      # evite d'en dependre.
      - "traefik.http.routers.cv-api.rule=(Host(`lorycarvajol.dev`) || Host(`www.lorycarvajol.dev`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.cv-api.priority=100"
      - "traefik.http.routers.cv-api.entrypoints=websecure"
      - "traefik.http.routers.cv-api.tls.certresolver=myresolver"
      - "traefik.http.services.cv-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.cv-api.middlewares=cv-www"

networks:
  proxy:
    external: true
